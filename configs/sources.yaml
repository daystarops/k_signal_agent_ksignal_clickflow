# K Signal source map.
# The launcher runs a balanced issue: top lanes around government, idols, sports, and local phenomenon.
# Naver API sources need NAVER_CLIENT_ID / NAVER_CLIENT_SECRET in .env.
# HTML sources need no keys but may require selector tuning as sites change.

categories:
  - government
  - idols
  - sports
  - local_phenomenon

sources:
  # -------------------------
  # GOVERNMENT / PUBLIC LIFE
  # -------------------------
  - name: "Naver News - Government Policy"
    enabled: true
    type: "naver_news_api"
    category: "government"
    query: "정부 정책 OR 대통령 OR 국회 OR 서울시 정책 OR 부동산 정책 OR 청년 정책"
    display: 8
    sort: "date"

  - name: "Naver Blog - Government Local Reaction"
    enabled: true
    type: "naver_blog_api"
    category: "government"
    query: "서울시 정책 반응 OR 청년 정책 후기 OR 부동산 정책 체감"
    display: 6
    sort: "date"

  # -------------------------
  # IDOLS / FANDOM / ENTERTAINMENT
  # -------------------------
  - name: "Naver News - Idol/Fandom"
    enabled: true
    type: "naver_news_api"
    category: "idols"
    query: "아이돌 팬덤 OR K팝 팬덤 OR 뉴진스 OR 아이브 OR 에스파 OR 르세라핌 OR 엔터테인먼트"
    display: 8
    sort: "date"

  - name: "Naver Image - Idol/Fandom Visuals"
    enabled: true
    type: "naver_image_api"
    category: "idols"
    query: "아이돌 팬덤 굿즈 포토카드 응원봉"
    display: 8
    sort: "date"

  - name: "TheQoo - Square"
    enabled: true
    type: "html_list"
    category: "idols"
    url: "https://theqoo.net/square"
    source_family: "theqoo"
    language: "ko"
    follow_article: true
    selectors:
      item: "tr, li"
      title: "a"
      link: "a"
      snippet: "td, .title, .subject"
      image: "img"

  # -------------------------
  # SPORTS / K LEAGUE / KBO
  # -------------------------
  - name: "Naver News - Sports Fandom"
    enabled: true
    type: "naver_news_api"
    category: "sports"
    query: "K리그 팬덤 OR 국내축구 OR K리그 마케팅 OR KBO 팬덤 OR 스포츠 응원 문화"
    display: 8
    sort: "date"

  - name: "Naver Image - Sports Culture"
    enabled: true
    type: "naver_image_api"
    category: "sports"
    query: "K리그 응원 문화 축구장 팬덤"
    display: 8
    sort: "date"

  - name: "FM Korea - Domestic Football"
    enabled: true
    type: "html_list"
    category: "sports"
    url: "https://www.fmkorea.com/football_korean"
    source_family: "fm_korea"
    language: "ko"
    follow_article: true
    selectors:
      item: "li.li, tr, article, li"
      title: ".title a, a.hotdeal_var8, a"
      link: ".title a, a.hotdeal_var8, a"
      snippet: ".summary, .content, .title, a"
      image: "img"

  # -------------------------
  # LOCAL PHENOMENA / PLACES / STREET CULTURE
  # -------------------------
  - name: "Naver News - Local Phenomena"
    enabled: true
    type: "naver_news_api"
    category: "local_phenomenon"
    query: "요즘 한국 유행 OR 성수동 핫플 OR 서울 생활 OR 로컬 트렌드 OR MZ 세대 소비"
    display: 8
    sort: "date"

  - name: "Naver Blog - Seoul Local Texture"
    enabled: true
    type: "naver_blog_api"
    category: "local_phenomenon"
    query: "성수동 핫플 후기 OR 서울 로컬 트렌드 OR 요즘 뜨는 동네"
    display: 8
    sort: "date"

  - name: "Naver Image - Local Visuals"
    enabled: true
    type: "naver_image_api"
    category: "local_phenomenon"
    query: "성수동 거리 카페 팝업스토어"
    display: 8
    sort: "date"

  # Optional raw/chaotic source. Enable later when you want sewer-sensor sentiment.
  - name: "DCInside - Best"
    enabled: false
    type: "html_list"
    category: "local_phenomenon"
    url: "https://gall.dcinside.com/board/lists/?id=dcbest"
    source_family: "dcinside"
    language: "ko"
    follow_article: true
    selectors:
      item: "tr.ub-content, tr"
      title: "td.gall_tit a, a"
      link: "td.gall_tit a, a"
      snippet: "td.gall_tit"
      image: "img"
